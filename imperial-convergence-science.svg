<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 418" role="img" aria-label="Imperial — School of Convergence Science">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="800" height="418" rx="14"/></clipPath>
    <radialGradient id="glow" cx="70%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0e1830"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="800" height="418" fill="#000"/>
    <rect width="800" height="418" fill="url(#glow)"/>

    <!-- generative filament ribbons sweeping across the right/top -->
    <g fill="none" stroke="#cdd8ea" stroke-width="0.6" opacity="0.55">
      <path d="M120 250 C 300 60, 520 120, 780 20" opacity="0.5"/>
      <path d="M120 262 C 300 74, 520 132, 780 34"/>
      <path d="M120 274 C 300 88, 520 144, 780 48"/>
      <path d="M120 286 C 300 102, 520 156, 780 62"/>
      <path d="M120 298 C 300 116, 520 168, 780 76"/>
      <path d="M120 310 C 300 130, 520 180, 780 90"/>
      <path d="M120 322 C 300 144, 520 192, 780 104"/>
      <path d="M120 334 C 300 158, 520 204, 780 118"/>
      <path d="M120 346 C 300 172, 520 216, 780 132"/>
      <path d="M120 358 C 300 186, 520 228, 780 146"/>
      <path d="M120 370 C 300 200, 520 240, 780 160" opacity="0.5"/>
    </g>
    <g fill="none" stroke="#9fb4d6" stroke-width="0.5" opacity="0.4">
      <path d="M300 400 C 470 250, 650 300, 810 150"/>
      <path d="M300 412 C 470 262, 650 312, 810 164"/>
      <path d="M300 424 C 470 274, 650 324, 810 178"/>
      <path d="M300 436 C 470 286, 650 336, 810 192"/>
      <path d="M300 448 C 470 298, 650 348, 810 206"/>
    </g>

    <!-- particle-burst clusters -->
    <g fill="#bcd0f0">
      <g transform="translate(300,150)" opacity="0.85">
        <circle r="1.6"/>
        <g stroke="#8fb0e0" stroke-width="0.5" opacity="0.7">
          <line x1="0" y1="0" x2="14" y2="-9"/><line x1="0" y1="0" x2="-11" y2="7"/>
          <line x1="0" y1="0" x2="8" y2="12"/><line x1="0" y1="0" x2="-13" y2="-6"/>
          <line x1="0" y1="0" x2="17" y2="4"/><line x1="0" y1="0" x2="-6" y2="15"/>
        </g>
        <circle cx="14" cy="-9" r="0.9"/><circle cx="-11" cy="7" r="0.9"/><circle cx="8" cy="12" r="0.9"/>
        <circle cx="-13" cy="-6" r="0.9"/><circle cx="17" cy="4" r="0.9"/><circle cx="-6" cy="15" r="0.9"/>
      </g>
      <g transform="translate(600,120)" opacity="0.8">
        <circle r="1.4"/>
        <g stroke="#8fb0e0" stroke-width="0.5" opacity="0.65">
          <line x1="0" y1="0" x2="12" y2="8"/><line x1="0" y1="0" x2="-14" y2="-5"/>
          <line x1="0" y1="0" x2="6" y2="-13"/><line x1="0" y1="0" x2="-8" y2="11"/>
          <line x1="0" y1="0" x2="16" y2="-3"/>
        </g>
        <circle cx="12" cy="8" r="0.8"/><circle cx="-14" cy="-5" r="0.8"/><circle cx="6" cy="-13" r="0.8"/>
        <circle cx="-8" cy="11" r="0.8"/><circle cx="16" cy="-3" r="0.8"/>
      </g>
      <g transform="translate(718,215)" opacity="0.85">
        <circle r="1.6"/>
        <g stroke="#a9c2ea" stroke-width="0.5" opacity="0.7">
          <line x1="0" y1="0" x2="15" y2="6"/><line x1="0" y1="0" x2="-12" y2="-8"/>
          <line x1="0" y1="0" x2="4" y2="14"/><line x1="0" y1="0" x2="-9" y2="12"/>
          <line x1="0" y1="0" x2="13" y2="-10"/><line x1="0" y1="0" x2="-16" y2="2"/>
        </g>
        <circle cx="15" cy="6" r="0.9"/><circle cx="-12" cy="-8" r="0.9"/><circle cx="4" cy="14" r="0.9"/>
        <circle cx="-9" cy="12" r="0.9"/><circle cx="13" cy="-10" r="0.9"/><circle cx="-16" cy="2" r="0.9"/>
      </g>
      <g transform="translate(470,95)" opacity="0.7">
        <circle r="1.1"/>
        <g stroke="#8fb0e0" stroke-width="0.45" opacity="0.6">
          <line x1="0" y1="0" x2="9" y2="-7"/><line x1="0" y1="0" x2="-10" y2="5"/><line x1="0" y1="0" x2="5" y2="10"/>
        </g>
      </g>
    </g>

    <!-- diagonal light streak, lower-left -->
    <path d="M-20 300 L 210 150" stroke="#5f7196" stroke-width="1" opacity="0.35"/>

    <!-- IMPERIAL wordmark -->
    <text x="48" y="70" fill="#ffffff" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="2.5">IMPERIAL</text>

    <!-- headline -->
    <g fill="#ffffff" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="-1">
      <text x="46" y="250" font-size="58">School of</text>
      <text x="46" y="308" font-size="58">Convergence</text>
      <text x="46" y="366" font-size="58">Science</text>
    </g>
  </g>
</svg>
